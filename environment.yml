name: ml-journey
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  # Core scientific stack
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.11
  # Machine learning
  - scikit-learn>=1.3
  # Visualisation
  - matplotlib>=3.7
  - seaborn>=0.12
  - plotly>=5.17
  # Notebooks
  - jupyter>=1.0
  - notebook>=7.0
  - ipywidgets>=8.0
  - pip:
    # ML extras not in conda-forge
    - xgboost>=2.0
    - lightgbm>=4.0
    - apyori>=1.1.2
    # NLP
    - nltk>=3.8
    # Dev tools
    - black>=24.0
    - isort>=5.13
    - pre-commit>=3.5
    - nbstripout>=0.6
    - pytest>=7.4