name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # Job 1: Lint Python source code in src/
  # ============================================================
  lint:
    name: Lint (black + isort + flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linting tools
        run: pip install black isort flake8 flake8-bugbear

      - name: Check formatting with black
        run: black --check src/

      - name: Check import order with isort
        run: isort --check-only src/

      - name: Lint with flake8
        run: flake8 src/ --max-line-length=88 --extend-ignore=E203,W503

  # ============================================================
  # Job 2: Run unit tests for src/ utilities
  # ============================================================
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: pytest tests/ -v --cov=src --cov-report=term-missing

  # ============================================================
  # Job 3: Validate notebook format (no broken notebooks)
  # ============================================================
  notebooks:
    name: Validate notebooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install nbformat
        run: pip install nbformat

      - name: Check notebook format validity
        run: |
          python - <<'EOF'
          import nbformat
          import glob
          import sys

          notebooks = glob.glob("**/*.ipynb", recursive=True)
          # Skip external course material
          notebooks = [n for n in notebooks if "Machine-Learning-A-Z" not in n]

          errors = []
          for path in notebooks:
              try:
                  with open(path) as f:
                      nb = nbformat.read(f, as_version=4)
                  nbformat.validate(nb)
              except Exception as e:
                  errors.append(f"{path}: {e}")

          if errors:
              print("Invalid notebooks found:")
              for e in errors:
                  print(f"  {e}")
              sys.exit(1)
          else:
              print(f"All {len(notebooks)} notebooks are valid.")
          EOF
